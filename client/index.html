<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Evita que Android/Chrome apliquen "force dark" e inviertan colores
         (fondos oscuros con texto claro pasaban a verse blanco sobre blanco). -->
    <meta name="color-scheme" content="light" />
    <title>SRServi - Sistema POS</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/iconweb.png" />
    <link rel="apple-touch-icon" href="/iconweb.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SRServi" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#D4AF37" />
    <meta name="description" content="Panel de administración SRServi" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Capturar el evento de instalación antes de que React cargue
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new Event('pwaInstallReady'));
      });

      // Registrar service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
