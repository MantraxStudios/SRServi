# SRServi — límite de tamaño de subida (global)
# ---------------------------------------------------------------------------
# Este drop-in aplica a TODOS los server blocks de nginx (contexto http),
# incluyendo el host principal y el default_server, que son los que estaban
# devolviendo 413 al subir archivos de ~90 MB en el CCTV.
#
# INSTALACIÓN (en el servidor, como root):
#   sudo cp server/nginx/upload-size.conf /etc/nginx/conf.d/upload-size.conf
#   sudo nginx -t          # valida la sintaxis
#   sudo systemctl reload nginx   # (o: sudo nginx -s reload)
#
# Nota: /etc/nginx/conf.d/*.conf se incluye automáticamente dentro del
# bloque http {} de /etc/nginx/nginx.conf, por eso NO lleva "server {}".
# ---------------------------------------------------------------------------

# 100 MB de subida máxima. El archivo del usuario pesa ~90 MB; si más
# adelante necesitás subir videos más grandes, aumentá este valor
# (ej. 500M o 1024M) y volvé a recargar nginx.
client_max_body_size 100M;

# Da tiempo suficiente para terminar subidas grandes en conexiones lentas.
client_body_timeout 600s;
