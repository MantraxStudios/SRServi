;──────────────────────────────────────────────────────────────────────────────
; SRServi · Enrutado de llamadas entrantes hacia el bot de voz IA
;
; La llamada entra por el troncal (contexto from-trunk). Contestamos, generamos
; un UUID, avisamos al bot (HTTP /init con el número que llama y el DID) y
; entregamos el audio por AudioSocket. El bot conversa y guarda el pedido.
;──────────────────────────────────────────────────────────────────────────────

[globals]
; Asterisk corre en network_mode: host, así que llega al bot por los puertos
; publicados en el host (ver docker-compose). Si mueves el bot a otra máquina,
; cambia 127.0.0.1 por su IP.
BOT_HTTP = http://127.0.0.1:8090
BOT_AS   = 127.0.0.1:8091

[from-trunk]
; _X. captura cualquier número marcado (el DID). ${EXTEN} = número llamado.
exten => _X.,1,NoOp(Llamada entrante DID=${EXTEN} desde ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(CURLOPT(conntimeout)=3)
 ; El bot genera y devuelve un UUID nuevo, y registra quién llama + el DID.
 same => n,Set(CALLUUID=${CURL(${BOT_HTTP}/new?from=${CALLERID(num)}&did=${EXTEN})})
 same => n,AudioSocket(${CALLUUID},${BOT_AS})
 same => n,Hangup()

; Fallback: si por algún motivo no hay número explícito
exten => s,1,Goto(from-trunk,_X.,1)
