;──────────────────────────────────────────────────────────────────────────────
; Carga automática de módulos, asegurando los que necesita este sistema:
;   res_pjsip*        → troncal SIP
;   app_audiosocket / res_audiosocket → streaming de audio al bot
;   func_curl / res_curl → pedir el UUID al bot y registrar la llamada (HTTP)
;──────────────────────────────────────────────────────────────────────────────
[modules]
autoload = yes

; Asegurar explícitamente (por si el build los tiene en noload)
load = res_pjsip.so
load = res_pjsip_session.so
load = chan_pjsip.so
load = app_audiosocket.so
load = res_audiosocket.so
load = func_curl.so
load = res_curl.so
