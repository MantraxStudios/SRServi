;──────────────────────────────────────────────────────────────────────────────
; SRServi · pjsip.conf — ESTE ARCHIVO SE GENERA AUTOMÁTICAMENTE.
;
; No lo edites a mano. Los troncales SIP se cargan por tienda en el panel
; (SRServi → Llamadas IA) y `sync-trunks.sh` (vía gen-pjsip.mjs) reescribe este
; archivo con un bloque por tienda y recarga Asterisk.
;
; Este contenido inicial solo define el transporte; al correr start.sh o
; sync-trunks.sh se completa con los troncales activos.
;──────────────────────────────────────────────────────────────────────────────

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
