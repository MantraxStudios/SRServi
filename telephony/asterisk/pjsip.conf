;──────────────────────────────────────────────────────────────────────────────
; SRServi · pjsip.conf GENERADO AUTOMÁTICAMENTE por gen-pjsip.mjs — NO EDITAR.
; Un único troncal SIP global: Sinch. Credenciales en telephony/.env (SINCH_SIP_*).
; Regenera con: ./sync-trunks.sh  (o se ejecuta solo en start.sh)
;──────────────────────────────────────────────────────────────────────────────

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; ── Troncal SIP único: Sinch ─────────────────────────────────────────────────
[reg_sinch]
type = registration
transport = transport-udp
outbound_auth = auth_sinch
server_uri = sip:sip.sinch.com:5060
client_uri = sip:demo123@sip.sinch.com
retry_interval = 60
forbidden_retry_interval = 300
expiration = 3600

[auth_sinch]
type = auth
auth_type = userpass
username = demo123
password = secret

[trunk_sinch]
type = endpoint
transport = transport-udp
context = from-trunk
disallow = all
allow = ulaw
allow = alaw
outbound_auth = auth_sinch
aors = aor_sinch
from_user = demo123
from_domain = sip.sinch.com
direct_media = no

[aor_sinch]
type = aor
contact = sip:sip.sinch.com:5060

[identify_sinch]
type = identify
endpoint = trunk_sinch
match = sip.sinch.com
