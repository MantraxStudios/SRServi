;──────────────────────────────────────────────────────────────────────────────
; SRServi · Troncal SIP para recibir llamadas (PSTN → Asterisk → bot de voz IA)
;
; Cada TIENDA tiene su propio número/troncal. Para UNA tienda, completa el
; bloque [trunk] con los datos que cargaste en el panel (Llamadas IA).
; Para VARIAS tiendas, duplica los bloques (trunk2, reg2, identify2...) o usa
; Asterisk Realtime (pjsip desde MySQL) — ver README.
;──────────────────────────────────────────────────────────────────────────────

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; ── Datos del proveedor (rellenar con lo del panel: host / usuario / clave) ──
[trunk]
type = registration
transport = transport-udp
outbound_auth = trunk_auth
server_uri = sip:SIP_HOST
client_uri = sip:SIP_USER@SIP_HOST
retry_interval = 60

[trunk_auth]
type = auth
auth_type = userpass
username = SIP_USER
password = SIP_PASSWORD

[trunk]
type = endpoint
transport = transport-udp
context = from-trunk
disallow = all
allow = ulaw
allow = alaw
outbound_auth = trunk_auth
aors = trunk_aor
from_user = SIP_USER
from_domain = SIP_HOST
direct_media = no

[trunk_aor]
type = aor
contact = sip:SIP_HOST

[trunk_identify]
type = identify
endpoint = trunk
match = SIP_HOST
