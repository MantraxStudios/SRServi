;──────────────────────────────────────────────────────────────────────────────
; SRServi · pjsip.conf — ESTE ARCHIVO SE GENERA AUTOMÁTICAMENTE.
;
; No lo edites a mano. El troncal SIP es ÚNICO (Sinch) y sus credenciales viven
; en telephony/.env (SINCH_SIP_*). `sync-trunks.sh` (vía gen-pjsip.mjs) reescribe
; este archivo con el troncal de Sinch y recarga Asterisk.
;
; Este contenido inicial solo define el transporte; al correr start.sh o
; sync-trunks.sh se completa con el troncal de Sinch.
;──────────────────────────────────────────────────────────────────────────────

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
